name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm test

      # `dist/` is the deliverable for the composite GitHub Action
      # consumers reach via `uses: w3-io/action-lint@<ref>`. It MUST
      # stay in lockstep with src/ so callers get the same behaviour
      # as the typechecker / tests just verified.
      - name: "Verify dist is up to date"
        run: |
          npm run build
          if ! git diff --quiet dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' locally and commit the diff."
            git --no-pager diff --stat dist/
            exit 1
          fi
